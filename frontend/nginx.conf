# nginx site for the Radar de Pliegos SPA.
#
# Two behaviours matter here, and both were broken with the stock config:
#
# 1. The shell (index.html) must never be cached. It is the only file that
#    names the hashed bundle, so a stale copy keeps loading an old bundle
#    after a deploy — the app "looks like before" even after a reload.
# 2. Client-side routes must fall back to the shell. Without it, a deep link
#    such as /licitaciones/320 returns 404 on refresh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed file names: they never change under the same URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback for every client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
